name: "Setup build tools"
description: "Action for setting up build tools"

runs:
  using: "composite"
  steps:
    - name: Install rust toolchain
      run: rustup install

    - name: Version info
      shell: bash
      run: |
        cargo --version --verbose
        ldd --version
        clang --version
        gcc --version
        cmake --version

    - name: Set preferred C tools
      shell: bash
      run: |
        echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV
        echo "CC=$(which clang)" >> $GITHUB_ENV
        echo "CXX=$(which clang++)" >> $GITHUB_ENV
        echo "LD=$(which lld)" >> $GITHUB_ENV

    - name: Install sccache
      uses: aranya-project/sccache-action@main
      with:
        version: "v0.10.0"

    - name: Configure sccache
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
      shell: bash

    - name: Install cargo-make
      uses: aranya-project/install-action@main
      with:
        tool: cargo-make@0.37.24

    - name: Install Protoc
      shell: bash
      run: |
        sudo apt-get install -y protobuf-compiler
        protoc --version
