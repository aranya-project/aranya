# The name of the daemon used for logging and debugging
# purposes.
name = "my-aranya-daemon"

# NB: All of the directories below must already exist. The
# daemon does not create them and exits at startup if any are
# missing.


# The directory where the daemon stores non-essential
# runtime files and other file objects (sockets etc.).
#
# # Multiple Daemon Support
#
# This directory should be unique for each instance of the
# daemon.
#
# # Example
#
# For example this could be `/var/run/aranya`.
#
# See also = systemd `RuntimeDirectory=` and
# `$XDG_RUNTIME_DIR`.
runtime_dir = "/var/run/aranya"

# The directory where the daemon stores non-portable data
# that should persist between application restarts.
#
# # Multiple Daemon Support
#
# This directory should be unique for each instance of the
# daemon.
#
# # Example
#
# For example this could be `/var/lib/aranya`.
#
# See also = systemd `StateDirectory=` and
# `$XDG_STATE_HOME`.
state_dir = "/var/lib/aranya"

# The directory where the daemon stores non-essential data
# files.
#
# NB: Currently reserved. The daemon checks that it exists but
# does not write to it.
#
# # Multiple Daemon Support
#
# This directory should be unique for each instance of the
# daemon.
#
# # Example
#
# For example this could be `/var/cache/aranya`.
#
# See also = systemd `CacheDirectory=` and
# `$XDG_CACHE_HOME`.
cache_dir = "/var/cache/aranya"

# The directory where the daemon writes log files.
#
# NB: Currently reserved. The daemon checks that it exists but
# logs are written to stderr, not this directory. Set the log
# filter with the `ARANYA_DAEMON` environment variable.
#
# # Multiple Daemon Support
#
# This directory should be unique for each instance of the
# daemon.
#
# # Example
#
# For example this could be `/var/log/aranya`.
#
# See also = systemd `LogsDirectory=`.
logs_dir = "/var/log/aranya"

# The directory where the daemon can find additional
# configuration files.
#
# NB: Currently reserved. The daemon checks that it exists but
# does not read from it.
#
# # Multiple Daemon Support
#
# This directory should be unique for each instance of the
# daemon.
#
# # Example
#
# For example this could be `/etc/aranya`.
#
# See also = systemd `ConfigDirectory=` and
# `$XDG_CONFIG_HOME`.
config_dir = "/etc/aranya"

# Aranya Fast Channels (AFC) configuration.
[afc]
# Required. The daemon will not start unless this is `true`.
enable = true
# POSIX shared memory object name. Must start with `/` and
# contain no other `/`.
#
# # Multiple Daemon Support
#
# This must be unique for each instance of the daemon.
shm_path = "/afc"
# Maximum number of AFC channels the shared memory segment
# can hold.
max_chans = 100

# QUIC sync configuration. Peers authenticate each other with
# mTLS.
[sync.quic]
# Required. The daemon will not start unless this is `true`.
enable = true
# Aranya sync server address (QUIC over UDP).
addr = "0.0.0.0:4321"
# Directory containing trusted root CA certificates (PEM
# format). Only files ending in `.pem` are loaded, and files
# ending in `.key.pem` are skipped.
root_certs_dir = "/etc/aranya/certs/ca"
# Path to the device's certificate file (PEM format). May
# contain a certificate chain.
#
# Peers use the address they dial as the TLS server name, so
# the certificate's subject alternative name (SAN) must match
# the IP address or DNS name other peers use to reach this
# device.
#
# Certificates are loaded once at startup. Restart the
# daemon after replacing them.
device_cert = "/etc/aranya/certs/device.crt"
# Path to the device's private key file (PEM format).
device_key = "/etc/aranya/certs/device.key"
